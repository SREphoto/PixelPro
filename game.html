<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Village Quest — PixelForge demo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#e6ebff;font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:14px}
h1{margin:6px 0 2px;font-size:22px}h1 span{color:#22d3ee}p.sub{color:#8b96b8;margin:0 0 10px;font-size:13px}
#wrap{position:relative;width:min(960px,100%)}
canvas{width:100%;border-radius:14px;border:1px solid #2a3560;image-rendering:pixelated;background:#000;display:block;touch-action:none}
#hud{position:absolute;top:10px;left:10px;background:rgba(10,15,36,.82);border:1px solid #2a3560;border-radius:10px;padding:8px 12px;font-size:13px;line-height:1.8;min-width:210px}
#hud b{color:#ffe066}.ok{color:#22c55e}.no{color:#f87171}
#toast{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:rgba(10,15,36,.9);border:1px solid #22d3ee;border-radius:10px;padding:8px 16px;font-size:14px;display:none;text-align:center;max-width:90%}
#overlay{position:absolute;inset:0;border-radius:14px;display:none;place-items:center;background:rgba(5,8,20,.8);text-align:center}
#overlay.show{display:grid}#overlay h2{font-size:34px;margin:0 0 8px}#overlay p{color:#cdd6f4;margin:4px 0}
#overlay button{background:linear-gradient(135deg,#7c5cff,#4f46e5);border:none;color:#fff;font-weight:700;border-radius:10px;padding:12px 22px;font-size:15px;cursor:pointer;margin-top:14px}
#touch{display:none;gap:8px;margin-top:10px;flex-wrap:wrap;justify-content:center}
#touch button{font-size:20px;padding:12px 18px;background:#1a2340;border:1px solid #2a3560;color:#fff;border-radius:12px;user-select:none;touch-action:none}
@media(pointer:coarse){#touch{display:flex}}
.bar{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;justify-content:center}
.bar button{background:#212c55;border:1px solid #2a3560;color:#e6ebff;border-radius:8px;padding:7px 14px;cursor:pointer}
a{color:#22d3ee}
</style>
</head>
<body>
<h1>🏰 Village Quest <span>— your assets, playable</span></h1>
<p class="sub">Warrior + pawns + 8 buildings + slimes + barrels, straight from PixelForge. <a href="index.html">← back to home</a> · <a href="studio.html">studio</a></p>
<div id="wrap">
<canvas id="game" width="960" height="600"></canvas>
<div id="hud">♥ <b id="hearts">♥♥♥</b><br>
🪙 Gold: <b id="gold">0</b> / 10<br>
⛪ Monastery: <span id="mon" class="no">✗</span><br>
👾 Slimes: <b id="slimes">0</b> / 4<br>
🛢 Barrels: <span id="barrels">0</span> / 5</div>
<div id="toast"></div>
<div id="overlay"><div><h2 id="ovTitle"></h2><p id="ovLine"></p><p id="ovSub" style="color:#8b96b8;font-size:13px"></p><button onclick="resetGame()">↻ Play again</button></div></div>
</div>
<div id="touch">
<button data-k="up">▲</button><button data-k="left">◀</button><button data-k="down">▼</button><button data-k="right">▶</button><button data-k="atk">⚔️</button><button data-k="talk">💬</button>
</div>
<div class="bar"><button onclick="resetGame()">↻ Restart (R)</button><button onclick="toggleMute()">🔊 Sound</button></div>
<script>
const cv=document.getElementById('game'),ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;
const toastEl=document.getElementById('toast');let toastT=null;
function toast(m,ms=2600){toastEl.textContent=m;toastEl.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>toastEl.style.display='none',ms);}

/* ---- audio ---- */
let AC=null,muted=false;
function beep(f,d=0.08,type='square',v=0.05){if(muted)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+d);o.stop(AC.currentTime+d);}catch(e){}}
function toggleMute(){muted=!muted;toast(muted?'🔇 muted':'🔊 sound on');}

/* ---- asset loading: key out black + measure art bounds (fixes floating) ---- */
const STRIPS={idle:['assets/Warrior_Idle.png',8],run:['assets/Warrior_Run.png',6],atk:['assets/Warrior_Attack2.png',4],atk2:['assets/Warrior_Attack1.png',4],guard:['assets/Warrior_Guard.png',6],axe:['assets/Pawn_Idle Axe.png',8],hammer:['assets/Pawn_Idle Hammer.png',8],gold:['assets/Pawn_Idle Gold.png',8]};
const BDEF=[['assets/Monastery.png',40,470],['assets/Castle.png',300,240],['assets/Barracks.png',770,300],['assets/Archery.png',30,190],['assets/Tower.png',820,480],['assets/House1.png',110,585],['assets/House2.png',500,585],['assets/House3.png',230,520]];
let S={},B=[];
function measure(c,keyBlack){const x=c.getContext('2d');let img,d;try{img=x.getImageData(0,0,c.width,c.height);d=img.data;}catch(e){return{top:0,bottom:c.height,left:0,right:c.width};}
if(keyBlack){for(let i=0;i<d.length;i+=4){if(d[i]<20&&d[i+1]<20&&d[i+2]<20)d[i+3]=0;}x.putImageData(img,0,0);}
let top=1e9,bottom=-1,left=1e9,right=-1;
for(let y=0;y<c.height;y++){for(let xx=0;xx<c.width;xx++){const i=(y*c.width+xx)*4;if(d[i+3]>10){if(y<top)top=y;if(y>bottom)bottom=y;if(xx<left)left=xx;if(xx>right)right=xx;}}}
return{top,bottom:bottom===-1?c.height:bottom,left:left===1e9?0:left,right:right===-1?c.width:right};}
function loadImage(src,keyBlack){return new Promise(res=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;const x=c.getContext('2d');x.drawImage(img,0,0);res({c,...measure(c,keyBlack),w:c.width,h:c.height});};img.onerror=()=>res(null);img.src=src;});}
async function loadAll(){for(const k in STRIPS){const a=await loadImage(STRIPS[k][0],true);if(a){a.n=STRIPS[k][1];a.fw=a.w/a.n;S[k]=a;}}
for(const [src,gx,gy] of BDEF){const a=await loadImage(src,false);if(a){a.gx=gx;a.gy=gy;B.push(a);}else{B.push({c:null,gx,gy,w:120,h:120,top:0,bottom:120,left:0,right:120});}}}

/* ---- world state ---- */
let player,pawns,slimes,coins,barrels,parts,visited,started,winT,deadT,dlg,gold,slimesKilled,totalSlimes,shake,flash;
function resetGame(){
player={x:480,y:480,face:1,state:'idle',ft:0,atkT:0,cd:0,inv:0,hp:3,didHit:false};
pawns=[{strip:'axe',x:300,y:300,hx:300,hy:300,ft:0,face:1,wt:0,mx:0,my:0,line:'Need those barrels smashed, warrior!'},
{strip:'hammer',x:660,y:300,hx:660,hy:300,ft:2,face:-1,wt:3,mx:0,my:0,line:'The Monastery glows at dusk. Go see it!'},
{strip:'gold',x:480,y:250,hx:480,hy:250,ft:4,face:1,wt:1,mx:0,my:0,line:'Ten gold, all slimes gone — then we feast!'}];
slimes=[0,1,2,3].map(i=>({x:[480,600,270,720][i],y:[340,400,270,470][i],hx:[480,600,270,720][i],hy:[340,400,270,470][i],hp:2,hurt:0,face:1,wt:0,phase:i*1.7,dead:false}));
totalSlimes=slimes.length;slimesKilled=0;gold=0;
coins=[[150,300],[350,150],[650,150],[700,560],[200,470],[520,350],[250,150],[860,560]].map(([x,y],i)=>({x,y,i,taken:false}));
barrels=[{x:360,y:470},{x:520,y:330},{x:660,y:320},{x:430,y:300},{x:700,y:200}].map(b=>({x:b.x,y:b.y,hp:2,glow:Math.random()*6}));
parts=[];visited=false;started=performance.now();winT=null;deadT=null;dlg=null;shake=0;flash=0;
$id('overlay').classList.remove('show');updateHUD();
toast('⚔️ WASD move · Space attack (hold!) · E talk · Shift guard · R restart');
}
function $id(s){return document.getElementById(s);}

/* ---- collisions (buildings) ---- */
function solids(){return B.map(b=>{const aw=b.right-b.left,ah=b.bottom-b.top;return{x:b.gx+b.left+aw*0.12,y:b.gy-ah+ah*0.12,w:aw*0.76,h:ah*0.88};});}
function collide(e,r=14){for(const s of solids()){const nx=Math.max(s.x,Math.min(e.x,s.x+s.w)),ny=Math.max(s.y,Math.min(e.y,s.y+s.h));const dx=e.x-nx,dy=e.y-ny;if(dx*dx+dy*dy<r*r){if(Math.abs(dx)>Math.abs(dy))e.x=s.x+(dx>0?s.w+r:-r);else e.y=s.y+(dy>0?s.h+r:-r);}}e.x=Math.max(18,Math.min(942,e.x));e.y=Math.max(50,Math.min(584,e.y));}

/* ---- input ---- */
const keys={};
function pressSpace(){if(!player||deadT||winT)return;if(player.cd<=0&&player.state!=='atk'){player.state='atk';player.atkT=0;player.didHit=false;player.cd=0.22;beep(200,0.1,'sawtooth',0.04);}}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();keys[k]=true;if(k===' ')pressSpace();if(k==='e')talk();if(k==='r')resetGame();});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
document.querySelectorAll('#touch button').forEach(b=>{const k=b.dataset.k;const dn=e=>{e.preventDefault();if(k==='atk'){keys[' ']=true;pressSpace();}else if(k==='talk')talk();else keys[k]=true;};const up=e=>{e.preventDefault();keys[k==='atk'?' ':k]=false;};b.addEventListener('pointerdown',dn);b.addEventListener('pointerup',up);b.addEventListener('pointerleave',up);});
function talk(){if(!player)return;let best=null,bd=80;pawns.forEach(p=>{const d=Math.hypot(p.x-player.x,p.y-player.y);if(d<bd){bd=d;best=p;}});if(best){dlg={t:best.line,until:performance.now()+3200,x:best.x,y:best.y};beep(660,0.08);}}

/* ---- background ---- */
let bg=null;
function makeBg(){bg=document.createElement('canvas');bg.width=960;bg.height=600;const x=bg.getContext('2d');
x.fillStyle='#3d7a37';x.fillRect(0,0,960,600);
for(let i=0;i<1100;i++){x.fillStyle=['#35702f','#458a3e','#2f6629'][i%3];x.fillRect(Math.random()*960,Math.random()*600,3,3);}
x.fillStyle='#8a6f4d';[[0,300,960,54],[480,0,54,600]].forEach(([a,b,w,h])=>x.fillRect(a,b,w,h));
x.fillStyle='#7a5f42';for(let i=0;i<220;i++){x.fillRect(Math.random()*960,Math.random()<.5?300+Math.random()*54:Math.random()*600,3,2);}
for(let i=0;i<90;i++){x.fillStyle=['#f1c40f','#fff','#ff7f7f'][i%3];x.fillRect(Math.random()*960,Math.random()*600,2,2);}
x.fillStyle='rgba(0,0,0,.15)';x.fillRect(0,0,960,12);}

/* ---- update ---- */
function update(dt){
if(winT||deadT)return;
shake=Math.max(0,shake-dt);flash=Math.max(0,flash-dt);
const sp=185;let mx=0,my=0;
if(keys['a']||keys['arrowleft']||keys['left'])mx-=1;
if(keys['d']||keys['arrowright']||keys['right'])mx+=1;
if(keys['w']||keys['arrowup']||keys['up'])my-=1;
if(keys['s']||keys['arrowdown']||keys['down'])my+=1;
const guard=!!keys['shift'];
player.cd=Math.max(0,player.cd-dt);player.inv=Math.max(0,player.inv-dt);
if(player.state==='atk'){player.atkT+=dt;if(player.atkT>0.34){player.state='idle';player.atkT=0;player.didHit=false;}
else if(player.atkT>0.09&&!player.didHit){player.didHit=true;slashHit();}
if(keys[' ']&&player.cd<=0)pressSpace();}
else if(guard){player.state='guard';}
else if(mx||my){const l=Math.hypot(mx,my);player.x+=mx/l*sp*dt;player.y+=my/l*sp*dt;if(mx)player.face=mx>0?1:-1;player.state='run';}
else player.state='idle';
collide(player,15);player.ft+=dt;
/* pawns wander */
pawns.forEach(p=>{p.wt-=dt;p.ft+=dt;if(p.wt<=0){p.wt=2+Math.random()*3;const a=Math.random()*Math.PI*2;p.mx=Math.cos(a)*40;p.my=Math.sin(a)*40;if(Math.abs(p.mx)>4)p.face=p.mx>0?1:-1;}const tx=p.hx+p.mx,ty=p.hy+p.my;p.x+=(tx-p.x)*Math.min(1,dt*0.8);p.y+=(ty-p.y)*Math.min(1,dt*0.8);});
/* slimes: wander + chase + attack */
slimes.forEach(s=>{if(s.dead)return;s.hurt=Math.max(0,s.hurt-dt);const d=Math.hypot(player.x-s.x,player.y-s.y);
if(d<150&&!deadT){s.state='chase';const l=d||1;s.x+=(player.x-s.x)/l*62*dt;s.y+=(player.y-s.y)/l*62*dt;s.face=player.x>s.x?1:-1;}
else{s.state='wander';s.wt-=dt;if(s.wt<=0){s.wt=1.5+Math.random()*2.5;const a=Math.random()*Math.PI*2;s.mx=Math.cos(a)*50;s.my=Math.sin(a)*50;}const tx=s.hx+(s.mx||0),ty=s.hy+(s.my||0);s.x+=(tx-s.x)*Math.min(1,dt*0.7);s.y+=(ty-s.y)*Math.min(1,dt*0.7);}
collide(s,11);
if(d<30&&player.inv<=0&&!deadT){if(guard){s.x-= (player.x-s.x)/(d||1)*30;s.y-= (player.y-s.y)/(d||1)*30;beep(320,0.08,'square',0.05);player.inv=0.4;toast('🛡️ Guarded!');}
else damagePlayer(s.x,s.y);}});
/* coins */
coins.forEach(c=>{if(!c.taken&&Math.hypot(c.x-player.x,c.y-player.y)<28){c.taken=true;gold++;burst(c.x,c.y,'#ffd43b');beep(880+Math.random()*200,0.1);toast('🪙 +1 gold');updateHUD();}});
parts=parts.filter(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;p.life-=dt;return p.life>0;});
/* monastery visit */
const mz={x:56,y:206,w:159,h:264};if(!visited&&player.x>mz.x&&player.x<mz.x+mz.w&&player.y>mz.y&&player.y<mz.y+mz.h){visited=true;beep(523,0.15);beep(784,0.2);updateHUD();toast('⛪ Monastery visited!');}
/* win check */
if(gold>=10&&visited&&slimesKilled>=totalSlimes&&!winT){winT=(performance.now()-started)/1000;beep(523,0.12);setTimeout(()=>beep(659,0.12),130);setTimeout(()=>beep(784,0.25),260);
$id('ovTitle').textContent='🎉 VILLAGE SAVED!';$id('ovLine').textContent=winT.toFixed(1)+'s — gold gathered, monastery blessed, slimes banished.';$id('ovSub').textContent='Assets: your Warrior, Pawns, 8 buildings — built in PixelForge.';$id('overlay').classList.add('show');}
}
function damagePlayer(fx,fy){player.hp--;player.inv=1.1;shake=0.45;flash=0.5;const d=Math.hypot(player.x-fx,player.y-fy)||1;player.x+=(player.x-fx)/d*26;player.y+=(player.y-fy)/d*26;burst(player.x,player.y-30,'#ef4444');beep(150,0.2,'sawtooth',0.07);updateHUD();if(player.hp<=0){deadT=(performance.now()-started)/1000;$id('ovTitle').textContent='💀 You fell';$id('ovLine').textContent='The slimes got you. Press R to try again.';$id('ovSub').textContent='Tip: hold Space to chain swings, Shift to guard.';$id('overlay').classList.add('show');}}
function slashHit(){const hx=player.x+player.face*44,hy=player.y-30;burst(hx,hy-4,'#e7f5ff');beep(180,0.1,'square',0.06);
barrels.forEach(b=>{if(b.hp>0&&Math.hypot(b.x-hx,b.y-(player.y-20))<60){b.hp--;burst(b.x,b.y-20,'#a16207');if(b.hp<=0){gold++;burst(b.x,b.y-30,'#ffd43b');beep(990,0.12);toast('🛢 Barrel smashed! +1 gold');updateHUD();}else beep(220,0.06);}});
slimes.forEach(s=>{if(s.dead)return;if(Math.hypot(s.x-hx,s.y-hy)<48){s.hp--;s.hurt=0.25;const d=Math.hypot(s.x-player.x,s.y-player.y)||1;s.x+=(s.x-player.x)/d*20;s.y+=(s.y-player.y)/d*20;beep(360,0.1,'square',0.06);
if(s.hp<=0){s.dead=true;slimesKilled++;gold++;burst(s.x,s.y,'#22c55e');burst(s.x,s.y-6,'#ffd43b');beep(700,0.1);beep(1050,0.12);toast('👾 Slime down! +1 gold');updateHUD();}}});
}
function burst(x,y,col){for(let i=0;i<12;i++){parts.push({x,y,vx:(Math.random()-.5)*220,vy:-Math.random()*220,life:.5+Math.random()*.4,col});}}
function updateHUD(){$id('hearts').textContent=player?'♥'.repeat(Math.max(0,player.hp)):'—';$id('gold').textContent=gold;$id('mon').textContent=visited?'✓':'✗';$id('mon').className=visited?'ok':'no';$id('slimes').textContent=slimesKilled+' / '+totalSlimes;$id('barrels').textContent=barrels.filter(b=>b.hp<=0).length+' / '+barrels.length;}

/* ---- draw helpers ---- */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function shadow(x,y,r){ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(x,y,r,r*0.35,0,0,7);ctx.fill();}
function drawStrip(key,idx,x,groundY,charH,face,alpha){const s=S[key];if(!s){ctx.fillStyle='#7c5cff';ctx.fillRect(x-charH/2,groundY-charH,charH,charH);return;}
const fw=s.fw,artH=Math.max(1,s.bottom-s.top),sc=charH/artH,w=fw*sc;
ctx.save();if(alpha!=null)ctx.globalAlpha=alpha;ctx.translate(Math.round(x),Math.round(groundY));ctx.scale(face||1,1);
ctx.drawImage(s.c,idx*fw,s.top,fw,artH,-w/2,-charH,w,charH);ctx.restore();}
function drawSlime(s){const t=performance.now()/1000;const moving=s.state==='chase';const hop=moving?Math.abs(Math.sin(t*9+s.phase))*4:Math.abs(Math.sin(t*3+s.phase))*2;
const w=15,h=13;const base=s.y-hop;
shadow(s.x,s.y,12);ctx.save();
if(s.hurt>0&&Math.floor(performance.now()/60)%2===0)ctx.globalAlpha=.45;
ctx.translate(Math.round(s.x),Math.round(base));ctx.scale(s.face||1,1);
ctx.fillStyle='#22c55e';rr(-w,-h-2,w*2,h+2,7);ctx.fill();
ctx.fillStyle='#4ade80';rr(-w+3,-h-2,w*2-6,3,3);ctx.fill();
ctx.fillStyle='#fff';rr(-w+4,-h+1,5,6,2);ctx.fill();rr(w-9,-h+1,5,6,2);ctx.fill();
ctx.fillStyle='#0b1020';rr(-w+6,-h+2,2,3,1);ctx.fill();rr(w-8,-h+2,2,3,1);ctx.fill();
ctx.fillStyle='#15803d';rr(-4,-h+9,8,2,1);ctx.fill();
if(s.hp===1){ctx.fillStyle='rgba(239,68,68,.5)';rr(-w,-h-2,4,h+2,3);ctx.fill();}
ctx.restore();}
function drawBarrel(b){const t=performance.now()/1000;shadow(b.x,b.y,13);
ctx.save();ctx.translate(Math.round(b.x),Math.round(b.y));
if(b.hp>0){ctx.globalAlpha=.25+Math.abs(Math.sin(t*2.5+b.glow))*.15;ctx.strokeStyle='#ffe066';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,-18,20,8,0,0,7);ctx.stroke();ctx.globalAlpha=1;}
ctx.fillStyle='#7c4a21';ctx.fillRect(-12,-38,24,38);
ctx.fillStyle='#a16207';ctx.fillRect(-12,-38,24,5);ctx.fillRect(-12,-16,24,4);
ctx.fillStyle='#5c3d1e';ctx.fillRect(-12,-38,3,38);ctx.fillRect(9,-38,3,38);
ctx.restore();}
function drawCoin(c){const t=performance.now()/300+c.i;const w=Math.abs(Math.cos(t))*8+3;const y=c.y-14+Math.sin(performance.now()/400+c.i)*3;
shadow(c.x,c.y+6,7);ctx.fillStyle='#fab005';ctx.beginPath();ctx.ellipse(c.x,y,w+3,12,0,0,7);ctx.fill();
ctx.fillStyle='#fff3bf';ctx.beginPath();ctx.ellipse(c.x-2,y,Math.max(1,w*0.3),7,0,0,7);ctx.fill();}

/* ---- draw ---- */
function draw(){
ctx.setTransform(1,0,0,1,0,0);
if(shake>0){ctx.translate((Math.random()-.5)*shake*16,(Math.random()-.5)*shake*16);}
ctx.drawImage(bg,0,0);
const draws=[];
B.forEach(b=>{if(b.c){draws.push({fy:b.gy,fn:()=>ctx.drawImage(b.c,b.gx,b.gy-b.bottom)});}});
coins.forEach(c=>{if(!c.taken)draws.push({fy:c.y,fn:()=>drawCoin(c)});});
barrels.forEach(b=>{if(b.hp>0)draws.push({fy:b.y,fn:()=>drawBarrel(b)});});
slimes.forEach(s=>{if(!s.dead)draws.push({fy:s.y,fn:()=>drawSlime(s)});});
pawns.forEach(p=>draws.push({fy:p.y,fn:()=>{shadow(p.x,p.y,15);drawStrip(p.strip,Math.floor(p.ft*5)%8,p.x,p.y-4,62,p.face);}}));
draws.push({fy:player.y,fn:()=>{if(player.inv>0&&Math.floor(performance.now()/80)%2===0)return;
shadow(player.x,player.y,17);const P=player;
if(P.state==='atk')drawStrip('atk',Math.min(3,Math.floor(P.atkT*12)),P.x,P.y-4,84,P.face);
else if(P.state==='guard')drawStrip('guard',0,P.x,P.y-4,84,P.face);
else if(P.state==='run')drawStrip('run',Math.floor(P.ft*10)%6,P.x,P.y-4,84,P.face);
else drawStrip('idle',Math.floor(P.ft*6)%8,P.x,P.y-4,84,P.face);
/* slash arc */
if(P.state==='atk'&&P.atkT>0.02&&P.atkT<0.22){ctx.save();ctx.translate(P.x,P.y-30);ctx.scale(P.face,1);ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=4;ctx.beginPath();ctx.arc(10,0,40,-0.9+Math.min(1,P.atkT/0.2)*1.9,-0.9);ctx.stroke();ctx.restore();}}});
parts.forEach(p=>draws.push({fy:9999,fn:()=>{ctx.globalAlpha=Math.min(1,p.life*2);ctx.fillStyle=p.col;ctx.fillRect(p.x,p.y,4,4);ctx.globalAlpha=1;}}));
draws.sort((a,b)=>a.fy-b.fy).forEach(d=>d.fn());
/* monastery beacon */
const t=performance.now()/500;ctx.strokeStyle=`rgba(255,224,102,${visited?0.25:0.6+Math.sin(t)*0.3})`;ctx.lineWidth=3;ctx.strokeRect(56,206,159,264);
/* dialogue */
if(dlg&&performance.now()<dlg.until){ctx.font='13px sans-serif';const bw=Math.min(300,ctx.measureText(dlg.t).width+20);ctx.fillStyle='rgba(10,15,36,.92)';ctx.fillRect(dlg.x-bw/2,dlg.y-140,bw,34);ctx.strokeStyle='#22d3ee';ctx.strokeRect(dlg.x-bw/2,dlg.y-140,bw,34);ctx.fillStyle='#fff';ctx.fillText(dlg.t,dlg.x-bw/2+10,dlg.y-118);}
/* hit flash */
if(flash>0){ctx.fillStyle=`rgba(239,68,68,${flash*0.35})`;ctx.fillRect(0,0,960,600);}
/* objective progress bar */
const prog=Math.min(1,(gold/10*0.4)+(visited?0.3:0)+(slimesKilled/totalSlimes*0.3));ctx.fillStyle='rgba(10,15,36,.7)';ctx.fillRect(0,590,960,10);ctx.fillStyle='#22c55e';ctx.fillRect(0,590,960*prog,10);
}

/* ---- main ---- */
let last=0;
function loop(ts){const dt=Math.min(0.05,(ts-last)/1000||0);last=ts;update(dt);draw();requestAnimationFrame(loop);}
(async()=>{makeBg();resetGame();await loadAll();updateHUD();requestAnimationFrame(loop);})();
</script>
</body>
